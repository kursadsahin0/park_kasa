# Yerel Postgres — docs/KURULUM.md
services:
  postgres:
    image: postgres:16-alpine
    container_name: otopark-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: otopark
      POSTGRES_PASSWORD: otopark
      POSTGRES_DB: otopark
    ports:
      - '5432:5432'
    volumes:
      - otopark_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U otopark']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  otopark_pg:
